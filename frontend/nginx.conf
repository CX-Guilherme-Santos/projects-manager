server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: routes like /projects/1/edit are resolved by the Vue router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets never change
  location /_nuxt/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
