# Monthly, one grouped PR per ecosystem (instead of one PR per package).
# GitFlow: update PRs target develop, never main.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/backend"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # @vee-validate/zod only supports zod 3
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # vue-tsc / nuxt typecheck don't support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/e2e"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
